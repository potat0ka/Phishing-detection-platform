[project]
name = "ai-phishing-detection-platform"
version = "1.0.0"
description = "AI-powered phishing detection platform with MongoDB backend"
requires-python = ">=3.8"
authors = [
    {name = "Bigendra Shrestha", email = "bigendra@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: Flask",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content"
]

dependencies = [
    # Core Flask dependencies
    "flask>=2.3.0",
    "flask-login>=0.6.0",
    "flask-pymongo>=2.3.0",
    "werkzeug>=3.0.0",
    
    # Database
    "pymongo>=4.5.0",
    "dnspython>=2.4.0",
    
    # Security and Authentication
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "passlib>=1.7.4",
    
    # Web scraping and text processing
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
    "nltk>=3.8.0",
    
    # Machine Learning - Core
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    
    # Machine Learning - Ensemble Models
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    
    # Deep Learning and NLP
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    
    # Real-time Processing
    "celery>=5.3.0",
    "redis>=4.5.0",
    
    # API Security and Rate Limiting
    "flask-cors>=4.0.0",
    "flask-limiter>=3.3.0",
    "pyjwt>=2.8.0",
    
    # Data Feeds and External APIs
    "feedparser>=6.0.0",
    "tldextract>=5.0.0",
    "whois>=0.9.0",
    "geoip2>=4.7.0",
    
    # Monitoring and Metrics
    "prometheus-client>=0.17.0",
    "psutil>=5.9.0",
    
    # Caching
    "flask-caching>=2.1.0",
    
    # File processing
    "pillow>=9.5.0",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    
    # Media processing
    "opencv-python>=4.8.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "imagehash>=4.3.0",
    
    # Validation
    "email-validator>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-flask>=1.2.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/bigendra/ai-phishing-detection"
Repository = "https://github.com/bigendra/ai-phishing-detection.git"
Issues = "https://github.com/bigendra/ai-phishing-detection/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["src"] by default)
include = ["models*", "routes*", "services*", "utils*", "templates*", "static*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["tests*"]  # exclude packages matching these glob patterns (empty by default)

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv"
]
